name: nfc_tag_master
description: "A real cross-platform NFC tag reader and writer app for Android and iOS."
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  path_provider: ^2.1.2
  share_plus: 13.3.0
  file_selector: 1.1.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  pdf: ^3.13.1
  cryptography: ^2.9.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/app_icons/
