name: App Store status

# Read-only: prints the App Store review / release state of the app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tool/asc_status.py'
      - '.github/workflows/app-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read App Store state
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography
          key="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -d > "$key"
          export ASC_API_PRIVATE_KEY_PATH="$key"
          python3 tool/asc_status.py | tee "$RUNNER_TEMP/status.txt"
          { echo '### App Store status'; echo '```'; cat "$RUNNER_TEMP/status.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$key"
