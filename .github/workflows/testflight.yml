name: Build and upload iPhone TestFlight beta

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (off = build and sign only)'
        type: boolean
        default: true
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          IOS_APPSTORE_P12_BASE64: ${{ secrets.IOS_APPSTORE_P12_BASE64 }}
          IOS_APPSTORE_P12_PASSWORD: ${{ secrets.IOS_APPSTORE_P12_PASSWORD }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          for name in IOS_APPSTORE_P12_BASE64 IOS_APPSTORE_P12_PASSWORD IOS_BUNDLE_ID IOS_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          # The Xcode project names this bundle ID for the app, widgets and watch.
          [[ "$IOS_BUNDLE_ID" == "com.bluetwinklez.nfctagmaster" ]] || { echo '::error::IOS_BUNDLE_ID does not match the Xcode project'; exit 1; }

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve dependencies and run checks
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter precache --ios
          cd ios
          pod install

      - name: Install distribution certificate
        env:
          IOS_APPSTORE_P12_BASE64: ${{ secrets.IOS_APPSTORE_P12_BASE64 }}
          IOS_APPSTORE_P12_PASSWORD: ${{ secrets.IOS_APPSTORE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_APPSTORE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_APPSTORE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution:' || { echo '::error::P12 must contain an Apple Distribution signing identity'; exit 1; }
          serial="$(security find-certificate -a -c 'Apple Distribution' -p "$keychain" | openssl x509 -noout -serial | cut -d= -f2)"
          echo "CERT_SERIAL=$serial" >> "$GITHUB_ENV"

      # Bundle IDs, capabilities (NFC, iCloud) and one App Store profile per
      # target (app, widgets, watch) are created through the API each run.
      - name: Create provisioning profiles
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --quiet pyjwt cryptography
          key="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$key"
          export ASC_API_PRIVATE_KEY_PATH="$key"
          export PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles:$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          python3 tool/asc_provision.py
          rm -f "$key"

      # iCloud backup ships only when the profile allows it (enabling the
      # capability needs an Admin API key); otherwise the app hides it.
      - name: Match iCloud entitlement to the profile
        run: |
          set -euo pipefail
          if [[ "${ICLOUD_ENABLED:-0}" == "1" ]]; then
            /usr/libexec/PlistBuddy -c "Add :NfcICloudBackup bool true" ios/Runner/Info.plist
          else
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.ubiquity-kvstore-identifier" ios/Runner/Runner.entitlements
          fi

      - name: Archive and export signed IPA
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>NFCTM CI App</string>
              <key>$IOS_BUNDLE_ID.widgets</key><string>NFCTM CI Widgets</string>
              <key>$IOS_BUNDLE_ID.watchkitapp</key><string>NFCTM CI Watch</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa
          find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f | grep -q .

      - name: Upload to App Store Connect for TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          chmod 700 "$HOME/.private_keys"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          [[ -n "$ipa" ]] || { echo '::error::IPA not found'; exit 1; }
          xcrun altool --upload-app --type ios -f "$ipa" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Remove temporary signing files
        if: always()
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/ExportOptions.plist"
          if [[ -n "${ASC_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          fi
