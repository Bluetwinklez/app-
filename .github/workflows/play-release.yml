name: Build and upload Google Play release

# Builds a signed Android App Bundle (.aab). With `upload` on, sends it to
# the chosen Google Play track. Without the signing secrets (e.g. on push)
# it signs with the debug key and only checks that the bundle builds.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to Google Play (off = build only, bundle kept as an artifact)'
        type: boolean
        default: false
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (draft is required until the app is first published)'
        type: choice
        options: [draft, completed]
        default: draft
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/play-release.yml'

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.5
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies and run checks
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Install upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            if [[ "$UPLOAD" == "true" ]]; then
              echo '::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets'
              exit 1
            fi
            echo '::warning::No upload key secrets; signing with the debug key (build check only).'
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        run: |
          # Every run gets a higher version code than the last one.
          flutter build appbundle --release --build-number=$((100 + GITHUB_RUN_NUMBER))
          ls -l build/app/outputs/bundle/release/

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bluetwinklez.nfctagmaster
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
