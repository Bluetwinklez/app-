name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-3.47.5-${{ runner.os }}

      - name: Install Flutter 3.47.5
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"

      - name: Add Flutter to PATH
        run: |
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations (must match committed files)
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
