name: App Store metadata

# Shows the App Store text of the version being edited, or applies
# tool/asc_metadata_fix.json to it (fix). Nothing is submitted for review.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'show or fix'
        type: choice
        options: [show, fix]
        default: show
  push:
    branches-ignore: [main]
    paths:
      - 'tool/asc_metadata.py'
      - '.github/workflows/app-metadata.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read or update App Store text
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          MODE: ${{ inputs.mode || 'show' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography
          key="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -d > "$key"
          export ASC_API_PRIVATE_KEY_PATH="$key"
          if [[ "$MODE" == fix ]]; then
            python3 tool/asc_metadata.py fix tool/asc_metadata_fix.json
          fi
          python3 tool/asc_metadata.py show
          rm -f "$key"
