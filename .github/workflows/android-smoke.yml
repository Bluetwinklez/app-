name: Android launch test

# Installs the release build on an emulator, opens it and fails if the app
# crashes on start. Saves a screenshot and the log.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.5
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/android_launch_check.sh

      - name: Keep screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch
          path: |
            launch.png
            logcat.txt
